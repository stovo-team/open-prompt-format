name: Publish packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_python:
        description: Publish the Python distribution to PyPI
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'push' || inputs.publish_python
    uses: ./.github/workflows/ci.yml

  publish-python:
    if: github.event_name == 'push' || inputs.publish_python
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/open-prompt-format
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build packages/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
