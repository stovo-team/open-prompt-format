name: CI

on:
  workflow_call:
  push:
    tags-ignore: ["v*"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e 'packages/python[jinja]'
      - run: python -m unittest discover -s packages/python/tests -v
      - run: opf validate-collection examples
      - run: opf check examples
      - run: opf verify-all --registry opf.yaml
      - run: python scripts/langfuse_smoke.py
