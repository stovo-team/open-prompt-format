[package]
name = "open-prompt-format-cli"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Native Rust CLI for Open Prompt Format"

[[bin]]
name = "opf"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
open-prompt-format = { path = "../opf" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
