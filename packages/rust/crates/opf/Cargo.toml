[package]
name = "open-prompt-format"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Load and render Open Prompt Format files"
repository = "https://github.com/stovo-team/open-prompt-format"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
